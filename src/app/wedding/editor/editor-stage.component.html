<div class="stage" [style.width]="width">
  <app-scene-frame [w]="piece.w" [h]="piece.h">
    <app-paper-art class="stage__art" [design]="design" [copy]="copy" [piece]="piece" />
    <div
      #layer
      class="stage__layer"
      [class.stage__layer--edit]="editable && face"
      [style.width.px]="piece.w"
      [style.height.px]="piece.h"
      (dragover)="onDragOver($event)"
      (drop)="onDrop($event)"
      (pointerdown)="onLayerDown($event)"
    >
      @if (dragging && snap) {
        <div class="stage__grid" aria-hidden="true"></div>
      }
      @if (guideX !== null) {
        <div class="stage__guide stage__guide--v" [style.left.%]="guideX * 100" aria-hidden="true"></div>
      }
      @if (guideY !== null) {
        <div class="stage__guide stage__guide--h" [style.top.%]="guideY * 100" aria-hidden="true"></div>
      }
      @for (s of faceStickers; track s.id) {
        <div
          class="stage__sticker"
          [class.stage__sticker--on]="editable && s.id === selectedId"
          [class.stage__sticker--locked]="editable && s.locked"
          [style.left.%]="s.x * 100"
          [style.top.%]="s.y * 100"
          [style.transform]="'translate(-50%, -50%) rotate(' + s.rotate + 'deg)'"
          [attr.tabindex]="editable ? 0 : null"
          [attr.role]="editable ? 'button' : null"
          [attr.aria-label]="editable ? 'Hình dán (kéo để di chuyển, phím mũi tên để chỉnh, Delete để xóa)' : null"
          (pointerdown)="onGrab($event, s)"
          (pointermove)="onDrag($event)"
          (pointerup)="onRelease($event)"
          (pointercancel)="onRelease($event)"
          (focus)="editable && select.emit(s.id)"
          (keydown)="editable && onKey($event, s)"
        >
          <app-editor-sticker [kind]="s.kind" [palette]="design.palette" [color]="s.color" [size]="s.size" [text]="s.text ?? ''" [font]="s.font ?? 'script'" [fonts]="design.fonts" [photo]="s.photo ?? null" [frame]="s.frame ?? 'oval'" [monogram]="copy.monogram" />
        </div>
      }
    </div>
  </app-scene-frame>
</div>
