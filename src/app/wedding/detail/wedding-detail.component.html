<app-language-toggle />

@if (design(); as d) {
  <main class="detail" [attr.lang]="lang()" [class.detail--dark]="isDark" [style.background]="d.palette.bg">
    <nav class="detail__bar">
      <a class="detail__pill" routerLink="/wedding">{{ ui().backToGallery }}</a>
      <button type="button" class="detail__pill detail__pill--button" (click)="print()">
        {{ ui().printLabel }}
      </button>
    </nav>

    <header class="detail__head">
      <h1 class="detail__name">{{ d.nameVi }}</h1>
      <p class="detail__desc">{{ d.description[lang()] }} · {{ categoryLabel(d) }}</p>
      <p class="detail__hint">{{ ui().detailHint }}</p>
    </header>

    <!-- Thiệp giấy: the printed suite, laid out flat. -->
    <section class="detail__section detail__paper" aria-labelledby="paper-title">
      <header class="detail__section-head">
        <h2 class="detail__section-title" id="paper-title">{{ ui().paperTitle }}</h2>
        <p class="detail__section-sub">{{ ui().paperSub }}</p>
      </header>
      <app-paper-suite [design]="d" [copy]="copy()" [labels]="ui().paperLabels" />
    </section>

    <!-- Thiệp online: the card as sent by link, next to the directions. -->
    <section class="detail__section detail__online" aria-labelledby="online-title">
      <header class="detail__section-head">
        <h2 class="detail__section-title" id="online-title">{{ ui().onlineTitle }}</h2>
        <p class="detail__section-sub">{{ ui().onlineSub }}</p>
        @if (!guest()) {
          <p class="detail__tip">
            {{ ui().guestTip }} <code>{{ guestExample(d) }}</code>
          </p>
        }
      </header>
      <div class="detail__online-grid">
        <app-online-card class="detail__online-card" [design]="d" [copy]="copy()" [lang]="lang()" [ui]="ui()" [guest]="guest()" />
        <app-directions-guide class="detail__guide" [design]="d" [collapsible]="true" />
      </div>
    </section>
  </main>
}
