<app-language-toggle />

@if (design(); as d) {
  <main class="detail" [attr.lang]="lang()" [class.detail--dark]="isDark" [style.background]="d.palette.bg">
    <nav class="detail__bar">
      <a class="detail__pill" routerLink="/wedding">{{ ui().backToGallery }}</a>
      <button type="button" class="detail__pill detail__pill--button" (click)="print()">
        {{ ui().printLabel }}
      </button>
    </nav>

    <header class="detail__head">
      <h1 class="detail__name">{{ d.nameVi }}</h1>
      <p class="detail__desc">{{ d.description[lang()] }} · {{ categoryLabel(d) }}</p>
      <p class="detail__hint">{{ ui().detailHint }}</p>
    </header>

    <section class="detail__suite">
      <div class="detail__stage-col">
        <app-scene-frame class="detail__stage" (click)="suite.advance()">
          <app-suite #suite [design]="d" [copy]="copy()" [interactive]="true" />
        </app-scene-frame>
        <div class="detail__controls">
          @switch (suite.state()) {
            @case ('sealed') {
              <button type="button" class="detail__action detail__action--primary" (click)="suite.open()">{{ ui().openLabel }}</button>
              <span class="detail__stage-hint">{{ ui().stageHint }}</span>
            }
            @case ('out') {
              @if (suite.hasInside) {
                <button type="button" class="detail__action detail__action--primary" (click)="suite.unfold()">{{ ui().insideLabel }}</button>
              }
              <button type="button" class="detail__action" (click)="suite.close()">{{ ui().closeLabel }}</button>
            }
            @case ('unfolded') {
              <button type="button" class="detail__action detail__action--primary" (click)="suite.fold()">{{ ui().foldLabel }}</button>
              <button type="button" class="detail__action" (click)="suite.close()">{{ ui().closeLabel }}</button>
            }
            @default {
              <span class="detail__stage-hint">…</span>
            }
          }
        </div>
      </div>
      <app-directions-guide class="detail__guide" [design]="d" />
    </section>

    <!-- Print: the flat card face, at full size. -->
    <div class="detail__print" aria-hidden="true">
      <app-invitation-card [design]="d" [copy]="copy()" />
    </div>
  </main>
}
