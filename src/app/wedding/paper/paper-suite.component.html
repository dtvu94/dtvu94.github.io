<div class="paper">
  @for (p of pieces; track p.kind; let i = $index) {
    <figure class="paper__piece paper__piece--{{ p.kind }}" [style.--w]="p.w">
      <!-- A click anywhere on the piece opens it in the zoom viewer; the
           button is the keyboard and screen-reader way in (its click
           bubbles up to the same handler). -->
      <div class="paper__zoomable" [class.paper__zoomable--on]="zoomLabel" (click)="open(i)">
        <app-scene-frame class="paper__frame" [w]="p.w" [h]="p.h">
          <app-paper-art class="paper__art" [design]="design" [copy]="copy" [piece]="p" />
        </app-scene-frame>
        @if (zoomLabel) {
          <button type="button" class="zoom-btn paper__zoom" [attr.aria-label]="zoomLabel + ': ' + labels[p.kind]">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="M15.4 15.4 21 21M10.5 7.6v5.8M7.6 10.5h5.8" />
            </svg>
          </button>
        }
      </div>
      <figcaption class="paper__label">{{ labels[p.kind] }}</figcaption>
    </figure>
  }
</div>
